<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Soccer Board</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #resetCamera {
      position: absolute;
      top: 10px; left: 10px;
      padding: 8px 12px;
      background: white; border: 1px solid #333;
      cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>
  <button id="resetCamera">視点を戻す</button>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // 明るい青空色

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 120, 120);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // カメラコントロール
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 50;
    controls.maxDistance = 200;
    controls.enablePan = true;

    // フィールド寸法 (実寸比率)
    const fieldLength = 105; // m
    const fieldWidth = 68;   // m

    // フィールド用キャンバス
    const canvas = document.createElement("canvas");
    canvas.width = 2048; // 解像度アップ対応（前よりキレイ）
    canvas.height = 2048;
    const ctx = canvas.getContext("2d");

    // 緑の芝
    ctx.fillStyle = "#228B22";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // スケーリング
    function toCanvasX(x) { return (x / fieldLength + 0.5) * canvas.width; }
    function toCanvasY(y) { return (0.5 - y / fieldWidth) * canvas.height; }

    ctx.strokeStyle = "white";
    ctx.lineWidth = 5;

    // 外枠
    ctx.strokeRect(toCanvasX(-fieldLength/2), toCanvasY(fieldWidth/2),
                   toCanvasX(fieldLength/2) - toCanvasX(-fieldLength/2),
                   toCanvasY(-fieldWidth/2) - toCanvasY(fieldWidth/2));

    // ハーフライン
    ctx.beginPath();
    ctx.moveTo(toCanvasX(0), toCanvasY(fieldWidth/2));
    ctx.lineTo(toCanvasX(0), toCanvasY(-fieldWidth/2));
    ctx.stroke();

    // センターサークル
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2, (9.15/fieldLength) * canvas.width, 0, Math.PI*2);
    ctx.stroke();

    // ペナルティエリア（両側）
    const penaltyWidth = 40.3; // m
    const penaltyDepth = 16.5; // m

    // 左
    ctx.strokeRect(toCanvasX(-fieldLength/2), toCanvasY(penaltyWidth/2),
                   toCanvasX(-fieldLength/2 + penaltyDepth) - toCanvasX(-fieldLength/2),
                   toCanvasY(-penaltyWidth/2) - toCanvasY(penaltyWidth/2));
    // 右
    ctx.strokeRect(toCanvasX(fieldLength/2 - penaltyDepth), toCanvasY(penaltyWidth/2),
                   toCanvasX(fieldLength/2) - toCanvasX(fieldLength/2 - penaltyDepth),
                   toCanvasY(-penaltyWidth/2) - toCanvasY(penaltyWidth/2));

    // ゴールエリア（両側）
    const goalWidth = 18.32; // m
    const goalDepth = 5.5;   // m

    // 左
    ctx.strokeRect(toCanvasX(-fieldLength/2), toCanvasY(goalWidth/2),
                   toCanvasX(-fieldLength/2 + goalDepth) - toCanvasX(-fieldLength/2),
                   toCanvasY(-goalWidth/2) - toCanvasY(goalWidth/2));
    // 右
    ctx.strokeRect(toCanvasX(fieldLength/2 - goalDepth), toCanvasY(goalWidth/2),
                   toCanvasX(fieldLength/2) - toCanvasX(fieldLength/2 - goalDepth),
                   toCanvasY(-goalWidth/2) - toCanvasY(goalWidth/2));

    // テクスチャとして適用
    const texture = new THREE.CanvasTexture(canvas);
    const fieldGeometry = new THREE.PlaneGeometry(fieldLength, fieldWidth);
    const fieldMaterial = new THREE.MeshBasicMaterial({ map: texture });
    const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
    field.rotation.x = -Math.PI/2;
    scene.add(field);

    // ライト
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(50, 100, 50);
    scene.add(light);

    // 視点リセット
    document.getElementById("resetCamera").addEventListener("click", () => {
      camera.position.set(0, 120, 120);
      controls.target.set(0, 0, 0);
    });

    // レンダリングループ
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
