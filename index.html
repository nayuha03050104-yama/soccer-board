<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Soccer Board - 安定版(回転/ズーム内蔵)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;}
    body{touch-action:none;} /* iPhoneでのスクロール/ズーム干渉を防止 */
    canvas{display:block;}
    #reset{position:fixed;top:10px;left:10px;z-index:10;padding:8px 12px;border:0;background:#000a;color:#fff;border-radius:6px}
  </style>
</head>
<body>
  <button id="reset">視点を戻す</button>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script>
  // ====== 基本セットアップ ======
  const scene = new THREE.Scene(); // 背景はCSS側の空色

  // 実寸比率：105m x 68m をワールドに正確反映（長辺=1000）
  const M_LEN = 105, M_WID = 68;
  const SCALE = 1000 / M_LEN;            // 1m -> SCALE ワールド単位
  const W_LEN = 1000;                    // ワールド長さ
  const W_WID = Math.round(M_WID * SCALE); // ワールド幅 ≒ 648

  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 5000);

  // 自前オービット（極座標）
  let radius = 1200;           // 距離
  let theta  = Math.PI * 0.25; // 水平角（左右）
  let phi    = Math.PI * 0.9;  // 垂直角（上下）
  const target = new THREE.Vector3(0,0,0);

  function updateCamera(){
    // 極座標 -> 直交
    const x = target.x + radius * Math.sin(phi) * Math.sin(theta);
    const y = target.y + radius * Math.cos(phi);
    const z = target.z + radius * Math.sin(phi) * Math.cos(theta);
    camera.position.set(x,y,z);
    camera.lookAt(target);
  }
  updateCamera();

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  // ====== 高解像度ピッチをCanvasで生成（2048px） ======
  const texCanvas = document.createElement('canvas');
  texCanvas.width = 2048; texCanvas.height = 2048;
  const ctx = texCanvas.getContext('2d');

  // 背景芝
  ctx.fillStyle = '#228B22';
  ctx.fillRect(0,0,texCanvas.width,texCanvas.height);

  // ワールド座標 [-W_LEN/2..W_LEN/2] × [-W_WID/2..W_WID/2] をキャンバスへ線形変換
  const toCX = x => (x / W_LEN + 0.5) * texCanvas.width;
  const toCY = z => (0.5 - z / W_WID) * texCanvas.height;

  ctx.strokeStyle = 'white';
  ctx.lineWidth = 6; // ズームしてもくっきり

  // 外枠
  ctx.strokeRect(
    toCX(-W_LEN/2), toCY(W_WID/2),
    toCX(W_LEN/2) - toCX(-W_LEN/2),
    toCY(-W_WID/2) - toCY(W_WID/2)
  );

  // ハーフライン
  ctx.beginPath();
  ctx.moveTo(toCX(0), toCY(W_WID/2));
  ctx.lineTo(toCX(0), toCY(-W_WID/2));
  ctx.stroke();

  // センターサークル (半径9.15m)
  const R_center = 9.15 * SCALE;
  ctx.beginPath();
  ctx.arc(texCanvas.width/2, texCanvas.height/2, R_center * texCanvas.width / W_LEN, 0, Math.PI*2);
  ctx.stroke();

  // ペナルティ/ゴールエリア寸法（m）
  const PEN_W = 40.32, PEN_D = 16.5;
  const GOAL_W = 18.32, GOAL_D = 5.5;

  // 左側（x=-W_LEN/2 がゴールライン）
  ctx.strokeRect(
    toCX(-W_LEN/2),                      toCY(PEN_W/2),
    toCX(-W_LEN/2 + PEN_D) - toCX(-W_LEN/2), toCY(-PEN_W/2) - toCY(PEN_W/2)
  );
  ctx.strokeRect(
    toCX(-W_LEN/2),                      toCY(GOAL_W/2),
    toCX(-W_LEN/2 + GOAL_D) - toCX(-W_LEN/2), toCY(-GOAL_W/2) - toCY(GOAL_W/2)
  );

  // 右側（x=+W_LEN/2 がゴールライン）
  ctx.strokeRect(
    toCX(W_LEN/2 - PEN_D),               toCY(PEN_W/2),
    toCX(W_LEN/2) - toCX(W_LEN/2 - PEN_D),   toCY(-PEN_W/2) - toCY(PEN_W/2)
  );
  ctx.strokeRect(
    toCX(W_LEN/2 - GOAL_D),              toCY(GOAL_W/2),
    toCX(W_LEN/2) - toCX(W_LEN/2 - GOAL_D),  toCY(-GOAL_W/2) - toCY(GOAL_W/2)
  );

  // コーナーアーク（半径1m）
  const R_corner = 1 * SCALE;
  function cornerArc(cx, cz, start, end){
    ctx.beginPath();
    ctx.arc(toCX(cx), toCY(cz), R_corner * texCanvas.width / W_LEN, start, end);
    ctx.stroke();
  }
  // 左下(-L/2,-W/2)
  cornerArc(-W_LEN/2, -W_WID/2, 0, Math.PI/2);
  // 左上(-L/2,+W/2)
  cornerArc(-W_LEN/2,  W_WID/2, -Math.PI/2, 0);
  // 右上(+L/2,+W/2)
  cornerArc( W_LEN/2,  W_WID/2, Math.PI, Math.PI*1.5);
  // 右下(+L/2,-W/2)
  cornerArc( W_LEN/2, -W_WID/2, Math.PI*0.5, Math.PI);

  const pitchTex = new THREE.CanvasTexture(texCanvas);
  pitchTex.anisotropy = renderer.capabilities.getMaxAnisotropy?.() || 1;

  const field = new THREE.Mesh(
    new THREE.PlaneGeometry(W_LEN, W_WID),
    new THREE.MeshBasicMaterial({ map: pitchTex })
  );
  field.rotation.x = -Math.PI/2;
  scene.add(field);

  // ====== 簡易ゴール（白い矩形ワイヤー）: 表示は後ほど強化可 ======
  function addGoal(xSign){ // xSign = -1(左) or +1(右)
    const gW = GOAL_W * SCALE, gH = 50, gD = 30; // 高さ/奥行きは簡易値（見栄え用）
    const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(gD, gH, gW));
    const mat = new THREE.LineBasicMaterial({color:0xffffff});
    const line = new THREE.LineSegments(geo, mat);
    line.position.set(xSign*(W_LEN/2 + gD/2), gH/2, 0);
    scene.add(line);
  }
  addGoal(-1); addGoal(1);

  // ====== 自前オービット操作（タッチ/マウス） ======
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let pinchStart = 0;

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  // マウス
  window.addEventListener('mousedown', e => { isDragging=true; lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('mousemove', e => {
    if(!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    theta -= dx * 0.005;
    phi   -= dy * 0.005;
    phi = clamp(phi, 0.15, 1.45);
    updateCamera();
  });
  window.addEventListener('mouseup',   ()=>{ isDragging=false; });
  window.addEventListener('mouseleave',()=>{ isDragging=false; });

  // ホイールでズーム
  window.addEventListener('wheel', e => {
    radius *= (1 + Math.sign(e.deltaY) * 0.1);
    radius = clamp(radius, 200, 2000);
    updateCamera();
  }, {passive:true});

  // タッチ：1本＝回転、2本＝ピンチズーム
  window.addEventListener('touchstart', e => {
    if(e.touches.length===1){
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }else if(e.touches.length===2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStart = Math.hypot(dx,dy);
    }
  }, {passive:true});

  window.addEventListener('touchmove', e => {
    if(e.touches.length===1){
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      const dx = x - lastX;
      const dy = y - lastY;
      lastX = x; lastY = y;
      theta -= dx * 0.005;
      phi   -= dy * 0.005;
      phi = clamp(phi, 0.15, 1.45);
      updateCamera();
    }else if(e.touches.length===2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx,dy);
      if(pinchStart>0){
        const scale = pinchStart / dist;
        radius *= scale;
        radius = clamp(radius, 200, 2000);
        updateCamera();
      }
      pinchStart = dist;
    }
  }, {passive:true});

  window.addEventListener('touchend', ()=>{ pinchStart=0; });

  // 視点リセット
  document.getElementById('reset').addEventListener('click', ()=>{
    radius = 1200; theta = Math.PI*0.25; phi = Math.PI*0.9;
    updateCamera();
  });

  // リサイズ
  window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ループ
  (function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  })();
  </script>
</body>
</html>
