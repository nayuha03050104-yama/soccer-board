<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サッカー戦術ボード</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; touch-action: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<script>
  // シーン・カメラ・レンダラー
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 50, 80);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 照明
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(50, 100, 50);
  scene.add(light);

  // サッカーグラウンド
  const fieldGeometry = new THREE.PlaneGeometry(100, 60);
  const fieldMaterial = new THREE.MeshPhongMaterial({ color: 0x228B22 });
  const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
  field.rotation.x = -Math.PI / 2;
  scene.add(field);

  // 選手
  const players = [];
  const playerGeometry = new THREE.CylinderGeometry(1, 1, 2, 32);
  const playerMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });

  for (let i = 0; i < 11; i++) {
    const player = new THREE.Mesh(playerGeometry, playerMaterial);
    player.position.set(-40 + i * 8, 1, 0);
    scene.add(player);
    players.push(player);
  }

  // ドラッグで移動できる処理
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let selectedPlayer = null;

  function getMouse(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    if (event.touches) {
      mouse.x = ((event.touches[0].clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.touches[0].clientY - rect.top) / rect.height) * 2 + 1;
    } else {
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }
  }

  function onPointerDown(event) {
    getMouse(event);
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(players);
    if (intersects.length > 0) {
      selectedPlayer = intersects[0].object;
    }
  }

  function onPointerMove(event) {
    if (!selectedPlayer) return;
    getMouse(event);
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(field);
    if (intersects.length > 0) {
      selectedPlayer.position.set(intersects[0].point.x, 1, intersects[0].point.z);
    }
  }

  function onPointerUp() {
    selectedPlayer = null;
  }

  renderer.domElement.addEventListener('mousedown', onPointerDown);
  renderer.domElement.addEventListener('mousemove', onPointerMove);
  renderer.domElement.addEventListener('mouseup', onPointerUp);

  renderer.domElement.addEventListener('touchstart', onPointerDown);
  renderer.domElement.addEventListener('touchmove', onPointerMove);
  renderer.domElement.addEventListener('touchend', onPointerUp);

  // レンダリングループ
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // リサイズ対応
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
