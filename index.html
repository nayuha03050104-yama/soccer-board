<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サッカー戦術ボード - フィールド完成版</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>

<script>
  // 基本セットアップ
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB); // 明るい空色背景

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 2000);
  camera.position.set(0, 500, 800);

  const renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // ライト
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(100, 200, 100).normalize();
  scene.add(light);

  // === フィールド作成 ===
  const fieldLength = 1050; // 実際の比率に近く
  const fieldWidth = 680;
  const fieldGeometry = new THREE.PlaneGeometry(fieldLength, fieldWidth);
  const fieldMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
  const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
  field.rotation.x = -Math.PI / 2;
  scene.add(field);

  // ライン描画（白）
  function drawLine(x1, y1, x2, y2) {
    const material = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
    const points = [
      new THREE.Vector3(x1, 0.1, y1),
      new THREE.Vector3(x2, 0.1, y2)
    ];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(geometry, material);
    scene.add(line);
  }

  // 外枠（タッチライン・ゴールライン）
  drawLine(-fieldLength/2, -fieldWidth/2, fieldLength/2, -fieldWidth/2);
  drawLine(-fieldLength/2, fieldWidth/2, fieldLength/2, fieldWidth/2);
  drawLine(-fieldLength/2, -fieldWidth/2, -fieldLength/2, fieldWidth/2);
  drawLine(fieldLength/2, -fieldWidth/2, fieldLength/2, fieldWidth/2);

  // ハーフライン
  drawLine(0, -fieldWidth/2, 0, fieldWidth/2);

  // センターサークル
  const circleGeometry = new THREE.RingGeometry(90, 91, 64);
  const circleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  const circle = new THREE.Mesh(circleGeometry, circleMaterial);
  circle.rotation.x = -Math.PI / 2;
  scene.add(circle);

  // ペナルティエリア（片側）
  function drawPenaltyArea(xCenter) {
    const areaWidth = 400;
    const areaHeight = 165;
    const leftX = xCenter - areaHeight/2;
    const rightX = xCenter + areaHeight/2;
    const topY = areaWidth/2;
    const bottomY = -areaWidth/2;
    drawLine(leftX, topY, rightX, topY);
    drawLine(leftX, bottomY, rightX, bottomY);
    drawLine(leftX, bottomY, leftX, topY);
    drawLine(rightX, bottomY, rightX, topY);
  }
  drawPenaltyArea(-fieldLength/2); // 左側
  drawPenaltyArea(fieldLength/2);  // 右側

  // ゴール（白枠で簡易）
  function createGoal(xPos) {
    const goalWidth = 73;
    const goalHeight = 24;
    const goalDepth = 10;
    const material = new THREE.LineBasicMaterial({ color: 0xffffff });
    const points = [
      new THREE.Vector3(xPos, 0, -goalWidth/2),
      new THREE.Vector3(xPos, goalHeight, -goalWidth/2),
      new THREE.Vector3(xPos+goalDepth, goalHeight, -goalWidth/2),
      new THREE.Vector3(xPos+goalDepth, 0, -goalWidth/2),
      new THREE.Vector3(xPos, 0, -goalWidth/2),
      new THREE.Vector3(xPos, 0, goalWidth/2),
      new THREE.Vector3(xPos, goalHeight, goalWidth/2),
      new THREE.Vector3(xPos+goalDepth, goalHeight, goalWidth/2),
      new THREE.Vector3(xPos+goalDepth, 0, goalWidth/2),
      new THREE.Vector3(xPos, 0, goalWidth/2),
    ];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(geometry, material);
    scene.add(line);
  }
  createGoal(-fieldLength/2); // 左ゴール
  createGoal(fieldLength/2);  // 右ゴール

  // リサイズ対応
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // レンダリングループ
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
