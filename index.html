<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Soccer Board 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #e0f7fa; }
    canvas { display: block; }
    #resetView {
      position: absolute;
      top: 10px; left: 10px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      z-index: 1;
    }
  </style>
</head>
<body>
  <button id="resetView">視点を戻す</button>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaee0ff);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
    camera.position.set(0, 250, 400);

    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ライト
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(100, 200, 100);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x888888));

    // フィールド
    const fieldWidth = 680, fieldHeight = 1050;
    const fieldGeometry = new THREE.PlaneGeometry(fieldWidth, fieldHeight);
    const fieldMaterial = new THREE.MeshPhongMaterial({color: 0x228b22});
    const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
    field.rotation.x = -Math.PI/2;
    scene.add(field);

    // ライン描画
    function drawLine(w, h, x, z) {
      const lineGeom = new THREE.PlaneGeometry(w, h);
      const lineMat = new THREE.MeshBasicMaterial({color: 0xffffff, side: THREE.DoubleSide});
      const line = new THREE.Mesh(lineGeom, lineMat);
      line.rotation.x = -Math.PI/2;
      line.position.set(x, 0.1, z);
      scene.add(line);
    }
    // 外枠
    drawLine(fieldWidth, 2, 0, fieldHeight/2);
    drawLine(fieldWidth, 2, 0, -fieldHeight/2);
    drawLine(2, fieldHeight, fieldWidth/2, 0);
    drawLine(2, fieldHeight, -fieldWidth/2, 0);
    // ハーフライン
    drawLine(fieldWidth, 2, 0, 0);

    // プレイヤー生成
    const players = [];
    const playerGeometry = new THREE.CylinderGeometry(0, 10, 30, 6);
    function createPlayer(color, num, x, z) {
      const material = new THREE.MeshPhongMaterial({color});
      const player = new THREE.Mesh(playerGeometry, material);
      player.position.set(x, 15, z);
      player.userData = {num};
      scene.add(player);
      players.push(player);
    }
    // 赤チーム
    for (let i=0; i<5; i++) createPlayer(0xff0000, i+1, -100, i*100-200);
    // 青チーム
    for (let i=0; i<5; i++) createPlayer(0x0000ff, i+1, 100, i*100-200);

    // ボール
    const ballGeom = new THREE.SphereGeometry(8, 16, 16);
    const ballMat = new THREE.MeshPhongMaterial({color: 0xffffff});
    const ball = new THREE.Mesh(ballGeom, ballMat);
    ball.position.set(0, 8, 0);
    scene.add(ball);

    // コントロール（ズーム・回転対応）
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0,0,0);

    // 視点切り替え
    let isPlayerView = false;
    document.getElementById("resetView").addEventListener("click", () => {
      isPlayerView = false;
      camera.position.set(0, 250, 400);
      controls.enabled = true;
    });

    // プレイヤータップ判定
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    function onClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(players);
      if (intersects.length > 0) {
        const player = intersects[0].object;
        camera.position.set(player.position.x, player.position.y + 40, player.position.z);
        camera.lookAt(player.position.x, player.position.y, player.position.z + 50);
        controls.enabled = false;
        isPlayerView = true;
      }
    }
    window.addEventListener('click', onClick);

    // ボール移動（スワイプ方向）
    let startX=0, startY=0;
    window.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    window.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      const dir = new THREE.Vector3(dx,0,-dy).normalize();
      ball.userData.velocity = dir.multiplyScalar(6);
    });

    // アニメーション
    function animate() {
      requestAnimationFrame(animate);

      if(ball.userData.velocity){
        ball.position.add(ball.userData.velocity);
        // ラインで止める
        if(Math.abs(ball.position.x) > fieldWidth/2-10 || Math.abs(ball.position.z) > fieldHeight/2-10){
          ball.userData.velocity.set(0,0,0);
        }
      }

      if(!isPlayerView) controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
