<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サッカー戦術ボード</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #backButton {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 4px;
      display: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<button id="backButton">視点を戻す</button>
<script>
  // シーン・カメラ・レンダラー
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 50, 80);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 照明
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(50, 100, 50);
  scene.add(light);

  // サッカーグラウンド
  const fieldGeometry = new THREE.PlaneGeometry(100, 60);
  const fieldMaterial = new THREE.MeshPhongMaterial({ color: 0x228B22 });
  const field = new THREE.Mesh(fieldGeometry, fieldMaterial);
  field.rotation.x = -Math.PI / 2;
  scene.add(field);

  // 選手作成
  const players = [];
  const playerGeometry = new THREE.CylinderGeometry(1, 1, 2, 32);

  function createPlayer(x, z, color, number) {
    const material = new THREE.MeshPhongMaterial({ color });
    const player = new THREE.Mesh(playerGeometry, material);
    player.position.set(x, 1, z);
    scene.add(player);

    // 番号ラベル
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 64;
    canvas.height = 64;
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = "black";
    ctx.font = "32px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(number, 32, 32);

    const texture = new THREE.CanvasTexture(canvas);
    const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
    const sprite = new THREE.Sprite(spriteMaterial);
    sprite.scale.set(5, 5, 1);
    sprite.position.set(0, 4, 0);
    player.add(sprite);

    player.userData.number = number;
    players.push(player);
    return player;
  }

  // 赤チーム
  for (let i = 0; i < 11; i++) {
    createPlayer(-30 + i * 6, -15, 0xff0000, i + 1);
  }
  // 青チーム
  for (let i = 0; i < 11; i++) {
    createPlayer(-30 + i * 6, 15, 0x0000ff, i + 1);
  }

  // ドラッグ・タップ判定
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let selectedPlayer = null;
  let dragging = false;
  let downPos = {x:0, y:0};

  function getMouse(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    if (event.touches) {
      mouse.x = ((event.touches[0].clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.touches[0].clientY - rect.top) / rect.height) * 2 + 1;
    } else {
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }
  }

  function onPointerDown(event) {
    getMouse(event);
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(players);
    if (intersects.length > 0) {
      selectedPlayer = intersects[0].object;
    }
    downPos = {x: event.clientX || event.touches[0].clientX, y: event.clientY || event.touches[0].clientY};
    dragging = false;
  }

  function onPointerMove(event) {
    if (!selectedPlayer) return;
    dragging = true;
    getMouse(event);
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(field);
    if (intersects.length > 0) {
      selectedPlayer.position.set(intersects[0].point.x, 1, intersects[0].point.z);
    }
  }

  function onPointerUp(event) {
    if (selectedPlayer) {
      const upPos = {x: event.clientX || (event.changedTouches && event.changedTouches[0].clientX),
                     y: event.clientY || (event.changedTouches && event.changedTouches[0].clientY)};
      const dx = Math.abs(upPos.x - downPos.x);
      const dy = Math.abs(upPos.y - downPos.y);
      if (!dragging && dx < 5 && dy < 5) {
        // タップ判定 → 視点切り替え
        playerView(selectedPlayer);
      }
    }
    selectedPlayer = null;
    dragging = false;
  }

  renderer.domElement.addEventListener('mousedown', onPointerDown);
  renderer.domElement.addEventListener('mousemove', onPointerMove);
  renderer.domElement.addEventListener('mouseup', onPointerUp);

  renderer.domElement.addEventListener('touchstart', onPointerDown);
  renderer.domElement.addEventListener('touchmove', onPointerMove);
  renderer.domElement.addEventListener('touchend', onPointerUp);

  // 選手視点カメラ
  let isPlayerView = false;
  const backButton = document.getElementById("backButton");

  function playerView(player) {
    isPlayerView = true;
    camera.position.copy(player.position);
    camera.position.y += 2;
    camera.lookAt(player.position.x, 2, player.position.z + 5);
    backButton.style.display = "block";
  }

  backButton.addEventListener("click", () => {
    isPlayerView = false;
    camera.position.set(0, 50, 80);
    camera.lookAt(0, 0, 0);
    backButton.style.display = "none";
  });

  // レンダリングループ
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // リサイズ対応
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
